[tool.poetry]
name = "university"
version = "0.1.0"
description = "Django web application for lab work"
authors = ["eternalsunset671 <mr.maxkozel@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.13"
django = "^5.2"
gunicorn = "^23.0"
psycopg2-binary = "^2.9"
pillow = "^12.1"
